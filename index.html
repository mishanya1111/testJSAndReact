<!doctype html>
<html lang="ru" class="h-full scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тест по JS и React</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      pre,
      code {
        font-family: "Fira Code", monospace;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-full flex flex-col pb-24">
    <!-- Sticky minimal top header -->
    <header
      class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm py-2.5 px-4"
    >
      <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
        <div
          class="flex items-center space-x-2 text-xs font-medium text-slate-500 flex-shrink-0"
        >
          <span>Ответы:</span>
        </div>

        <!-- Quick Summary Badges Navigation -->
        <div
          id="navBadgesContainer"
          class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"
        >
          <!-- Badges populated by JS -->
        </div>

        <button
          onclick="resetAnswers()"
          class="text-xs text-slate-400 hover:text-red-600 transition-colors flex-shrink-0 pl-2"
        >
          Сбросить
        </button>
      </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 space-y-5">
      <div id="questionsContainer" class="space-y-5">
        <!-- Questions dynamically generated by JS -->
      </div>
    </main>

    <!-- Bottom Control Bar -->
    <footer
      class="fixed bottom-0 left-0 right-0 z-50 bg-white/95 backdrop-blur border-t border-slate-200 shadow-lg py-3 px-4"
    >
      <div
        class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3"
      >
        <div class="text-xs text-slate-500 text-center sm:text-left">
          Введите секретное слово, чтобы проверить результаты:
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <input
            type="text"
            id="secretInput"
            placeholder="Введи слово ответы"
            onkeypress="if (event.key === 'Enter') checkSecretWord();"
            class="w-full sm:w-64 px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all"
          />
          <button
            onclick="checkSecretWord()"
            class="px-4 py-1.5 text-sm font-medium bg-sky-600 hover:bg-sky-700 text-white rounded-lg transition-colors flex-shrink-0"
          >
            Показать
          </button>
        </div>
      </div>
    </footer>

    <script>
      const STORAGE_KEY = "candidate_answers";
      const questionsData = [
        {
          id: 1,
          title: "Вопрос 1",
          questionText: "Что выведет следующий код в консоль?",
          code: "console.log(a);\nvar a = 10;\nfunction a() {}\nconsole.log(a);",
          correct: "C",
          options: [
            { letter: "A", text: "undefined, затем 10" },
            { letter: "B", text: "10, затем 10" },
            { letter: "C", text: "[Function: a], затем 10" },
            { letter: "D", text: "Uncaught ReferenceError: a is not defined" },
          ],
        },
        {
          id: 2,
          title: "Вопрос 2",
          questionText: "Что выведет следующий код с асинхронным выполнением?",
          code: "console.log('1');\nsetTimeout(() => console.log('2'), 0);\nPromise.resolve().then(() => {\n  console.log('3');\n  setTimeout(() => console.log('4'), 0);\n});\nPromise.resolve().then(() => console.log('5'));\nconsole.log('6');",
          correct: "B",
          options: [
            { letter: "A", text: "1, 6, 2, 3, 5, 4" },
            { letter: "B", text: "1, 6, 3, 5, 2, 4" },
            { letter: "C", text: "1, 2, 3, 5, 6, 4" },
            { letter: "D", text: "1, 6, 3, 2, 5, 4" },
          ],
        },
        {
          id: 3,
          title: "Вопрос 3",
          questionText:
            "Что выведет следующий код, тестирующий замыкания и временную мёртвую зону (TDZ)?",
          code: "let x = 10;\nfunction outer() {\n  console.log(x);\n  let x = 20;\n}\nouter();",
          correct: "D",
          options: [
            { letter: "A", text: "10" },
            { letter: "B", text: "undefined" },
            { letter: "C", text: "20" },
            {
              letter: "D",
              text: "Uncaught ReferenceError: Cannot access 'x' before initialization",
            },
          ],
        },
        {
          id: 4,
          title: "Вопрос 4",
          questionText:
            "Что выведет следующий код с контекстом this и стрелочными функциями?",
          code: "const obj = {\n  num: 42,\n  getNum: function() {\n    return () => this.num;\n  }\n};\n\nconst fn = obj.getNum();\nconst numGetter = {\n  num: 100,\n  fn: fn\n};\n\nconsole.log(numGetter.fn());",
          correct: "B",
          options: [
            { letter: "A", text: "100" },
            { letter: "B", text: "42" },
            { letter: "C", text: "undefined" },
            { letter: "D", text: "Uncaught TypeError" },
          ],
        },
        {
          id: 5,
          title: "Вопрос 5",
          questionText: "Что выведет этот код?",
          code: "for (var i = 0; i < 3; i++) {\n  setTimeout((function(i) {\n    return function() {\n      console.log(i);\n    };\n  })(i), 1000);\n}",
          correct: "A",
          options: [
            { letter: "A", text: "0, 1, 2" },
            { letter: "B", text: "3, 3, 3" },
            { letter: "C", text: "undefined, undefined, undefined" },
            { letter: "D", text: "0, 0, 0" },
          ],
        },
        {
          id: 6,
          title: "Вопрос 6",
          questionText:
            "Как алгоритм Reconciliation (сравнения) в React обрабатывает деревья компонентов и за какую временную сложность он это делает?",
          code: null,
          correct: "B",
          options: [
            {
              letter: "A",
              text: "Он за O(nlogn) строит граф зависимостей Fiber-узлов и выполняет бинарный поиск изменений в очереди вызовов (WorkLoop).",
            },
            {
              letter: "B",
              text: "Он за O(n) сравнивает деревья поуровнево, считая, что элементы разных типов дают разные деревья, а списки сопоставляются через ключи key.",
            },
            {
              letter: "C",
              text: "Он за O(n) использует мутационный прокси-слой для отслеживания геометрических изменений реального DOM до фазы Render Phase.",
            },
            {
              letter: "D",
              text: "Он за O(n²) выполняет диффинг (Diffing) через двойной указатель, сравнивая хэш-суммы пропсов каждого элемента с предыдущим кадром.",
            },
          ],
        },
        {
          id: 7,
          title: "Вопрос 7",
          questionText:
            "В чём заключается ключевое архитектурное предназначение React Fiber, появившегося в React 16?",
          code: null,
          correct: "D",
          options: [
            {
              letter: "A",
              text: "В изоляции фазы синтаксического анализа JSX и автоматической компиляции функциональных компонентов в WebAssembly для мгновенного монтирования.",
            },
            {
              letter: "B",
              text: "В создании встроенного слоя реактивности на базе WeakMap, чтобы избавить компоненты от необходимости вызывать setState при мутации пропсов.",
            },
            {
              letter: "C",
              text: "В переносе выполнения фазы Commit Phase в отдельный фоновый Web Worker для устранения блокировок интерфейса.",
            },
            {
              letter: "D",
              text: "В разбиении работы по рендерингу на дискретные кванты (units of work), что позволяет приостанавливать, отменять и приоритизировать вычисления в главном потоке.",
            },
          ],
        },
        {
          id: 8,
          title: "Вопрос 8",
          questionText:
            "Из каких двух основных фаз состоит процесс обновления компонента в архитектуре React Fiber?",
          code: null,
          correct: "A",
          options: [
            {
              letter: "A",
              text: "Render Phase (асинхронный поиск изменений без сайд-эффектов, может прерываться) и Commit Phase (синхронное внесение изменений в DOM и вызов эффектов).",
            },
            {
              letter: "B",
              text: "Initialization Phase (подготовка виртуального контекста и генерация JSX) и Execution Phase (выполнение сайд-эффектов и подписка на события).",
            },
            {
              letter: "C",
              text: "Mutation Phase (непосредственное изменение атрибутов DOM-узлов) и Rehydration Phase (восстановление состояния хуков из памяти браузера).",
            },
            {
              letter: "D",
              text: "Reconciliation Phase (сравнение типов элементов) и Layout Phase (вычисление CSS-сеток и вызов requestAnimationFrame).",
            },
          ],
        },
        {
          id: 9,
          title: "Вопрос 9",
          questionText:
            "В чём заключается фундаментальное различие между хуками useEffect и useLayoutEffect?",
          code: null,
          correct: "C",
          options: [
            {
              letter: "A",
              text: "useEffect гарантирует синхронное выполнение внутри того же микротаска, что и setState, а useLayoutEffect планирует выполнение в макрозадаче через setTimeout.",
            },
            {
              letter: "B",
              text: "useLayoutEffect выполняется только во время фазы сервера (SSR/RSC), в то время как useEffect работает исключительно на клиенте.",
            },
            {
              letter: "C",
              text: "useLayoutEffect вызывается синхронно после мутации DOM, но до отрисовки кадров браузером (Paint), а useEffect — асинхронно после отрисовки.",
            },
            {
              letter: "D",
              text: "useEffect вызывается на каждом рендере до фазы Commit Phase, а useLayoutEffect — только при первом монтировании элемента (Mount).",
            },
          ],
        },
        {
          id: 10,
          title: "Вопрос 10",
          questionText:
            "Почему согласно правилам React (Rules of Hooks) хуки категорически нельзя вызывать внутри условий (if), циклов или вложенных функций?",
          code: null,
          correct: "C",
          options: [
            {
              letter: "A",
              text: "Вызов хука внутри условия превращает функциональный компонент в асинхронную генераторную функцию, что ловит исключения в фазе Render Phase.",
            },
            {
              letter: "B",
              text: "Это ограничение движка V8: условия нарушают работу встроенных кэшей (Inline Caches), снижая производительность чтения useState.",
            },
            {
              letter: "C",
              text: "React отслеживает состояния хуков внутри Fiber-узла по их последовательному порядковому индексу в связном списке при каждом повторном рендере.",
            },
            {
              letter: "D",
              text: "Это ломает работу механизма батчинга (Automatic Batching), вызывая каскадные перерендеры всех дочерних компонентов.",
            },
          ],
        },
      ];

      let userAnswers = loadAnswers();
      let showAnswersMode = false;

      window.addEventListener("DOMContentLoaded", () => {
        renderNavBadges();
        renderQuestions();
      });

      function checkSecretWord() {
        const input = document.getElementById("secretInput");
        const val = input.value.trim().toLowerCase();

        if (val === "ответы") {
          showAnswersMode = true;
          renderNavBadges();
          renderQuestions();
        } else {
          alert('Неверное слово! Введите "ответы".');
        }
      }

      function loadAnswers() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          console.error("Не удалось загрузить ответы из localStorage", e);
          return {};
        }
      }

      function saveAnswers() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(userAnswers));
        } catch (e) {
          console.error("Не удалось сохранить ответы в localStorage", e);
        }
      }

      function renderNavBadges() {
        const container = document.getElementById("navBadgesContainer");
        container.innerHTML = questionsData
          .map((q) => {
            const selected = userAnswers[q.id];
            const badgeText = selected ? `${q.id}${selected}` : `${q.id}-`;

            let styleClasses = "bg-slate-100 text-slate-500 hover:bg-slate-200";

            if (showAnswersMode) {
              if (selected === q.correct) {
                styleClasses =
                  "bg-emerald-600 text-white font-semibold shadow-sm";
              } else if (selected && selected !== q.correct) {
                styleClasses = "bg-rose-600 text-white font-semibold shadow-sm";
              } else {
                styleClasses =
                  "bg-amber-100 text-amber-800 border border-amber-300 font-semibold";
              }
            } else if (selected) {
              styleClasses = "bg-slate-900 text-white font-semibold shadow-sm";
            }

            return `
                    <button onclick="scrollToQuestion(${q.id})" 
                            class="px-2 py-1 text-xs font-mono rounded transition-all flex-shrink-0 min-w-[34px] text-center ${styleClasses}">
                        ${badgeText}
                    </button>
                `;
          })
          .join("");
      }

      function renderQuestions() {
        const container = document.getElementById("questionsContainer");
        container.innerHTML = questionsData
          .map((q) => {
            const selectedOption = userAnswers[q.id];

            let statusBadge = "";
            if (showAnswersMode) {
              if (selectedOption === q.correct) {
                statusBadge = `<span class="inline-block px-2.5 py-0.5 mb-2 text-xs font-semibold bg-emerald-100 text-emerald-800 rounded-full">✓ Правильно</span>`;
              } else if (selectedOption) {
                statusBadge = `<span class="inline-block px-2.5 py-0.5 mb-2 text-xs font-semibold bg-rose-100 text-rose-800 rounded-full">✕ Неправильно</span>`;
              } else {
                statusBadge = `<span class="inline-block px-2.5 py-0.5 mb-2 text-xs font-semibold bg-amber-100 text-amber-800 rounded-full">! Ответ не выбран</span>`;
              }
            }

            return `
                    <article id="question-card-${q.id}" class="bg-white rounded-xl p-5 border border-slate-200/80 shadow-sm">
                        <div class="flex items-center justify-between">
                            <div class="text-xs font-bold text-sky-600 mb-2">${q.title}</div>
                            ${statusBadge}
                        </div>

                        <h3 class="text-base font-medium text-slate-900 mb-3">
                            ${q.questionText}
                        </h3>

                        ${
                          q.code
                            ? `
                            <div class="mb-4 rounded-lg overflow-hidden bg-slate-900 text-slate-100 p-3.5 text-xs sm:text-sm">
                                <pre><code>${escapeHtml(q.code)}</code></pre>
                            </div>
                        `
                            : ""
                        }

                        <div class="space-y-2 mt-3">
                            ${q.options
                              .map((opt) => {
                                const isSelected =
                                  selectedOption === opt.letter;
                                const isCorrect = opt.letter === q.correct;

                                let btnStyle =
                                  "border-slate-200 bg-white text-slate-700 hover:bg-slate-50";
                                let badgeStyle = "bg-slate-100 text-slate-600";

                                if (showAnswersMode) {
                                  if (isCorrect) {
                                    btnStyle =
                                      "border-emerald-500 bg-emerald-50 text-emerald-900 font-medium ring-1 ring-emerald-500";
                                    badgeStyle =
                                      "bg-emerald-600 text-white font-bold";
                                  } else if (isSelected && !isCorrect) {
                                    btnStyle =
                                      "border-rose-500 bg-rose-50 text-rose-900 font-medium ring-1 ring-rose-500";
                                    badgeStyle =
                                      "bg-rose-600 text-white font-bold";
                                  }
                                } else if (isSelected) {
                                  btnStyle =
                                    "border-sky-500 bg-sky-50/60 text-sky-900 font-medium ring-1 ring-sky-500";
                                  badgeStyle =
                                    "bg-sky-600 text-white font-bold";
                                }

                                return `
                                    <button onclick="selectOption(${q.id}, '${opt.letter}')" 
                                            class="w-full text-left p-3 rounded-lg border transition-all flex items-start space-x-3 ${btnStyle}">
                                        <span class="inline-flex items-center justify-center w-5 h-5 rounded text-xs flex-shrink-0 transition-colors ${badgeStyle}">
                                            ${opt.letter}
                                        </span>
                                        <span class="text-sm leading-snug pt-0.5">${escapeHtml(opt.text)}</span>
                                    </button>
                                `;
                              })
                              .join("")}
                        </div>
                    </article>
                `;
          })
          .join("");
      }

      function selectOption(questionId, letter) {
        userAnswers[questionId] = letter;
        saveAnswers();
        renderNavBadges();
        renderQuestions();
      }

      function scrollToQuestion(id) {
        const card = document.getElementById(`question-card-${id}`);
        if (card) {
          const offset = 60;
          const bodyRect = document.body.getBoundingClientRect().top;
          const elementRect = card.getBoundingClientRect().top;
          const offsetPosition = elementRect - bodyRect - offset;

          window.scrollTo({ top: offsetPosition, behavior: "smooth" });
        }
      }

      function resetAnswers() {
        userAnswers = {};
        showAnswersMode = false;
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {
          console.error("Не удалось удалить ответы из localStorage", e);
        }
        renderNavBadges();
        renderQuestions();
      }

      function escapeHtml(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
    </script>
  </body>
</html>
